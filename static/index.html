<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Label Printer</title>
  <link rel="stylesheet" href="/static/css/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>

<body>
  <!-- On/Off Button -->
  <button class="power-button" id="power-button" title="Power">
    <i class="fas fa-power-off"></i>
  </button>

  <h2>Label Printer</h2>
  <form id="label-form">
    <label for="font"> Font</label>
    <input type="text" id="font" placeholder="DejaVuSans" />
    <label for="fontsize"> Font Size</label>
    <input type="text" id="fontsize" placeholder="Auto-sized labels" />
    <div id="labels-container"></div>
    <div class="actions">
      <button type="button" onclick="addLabel()">➕ Add Label</button>
      <button type="submit">🖨️ Print</button>
      <button type="button" onclick="reloadLocation()">&circlearrowleft; Reset</button>
      <button type="button" id="list-fonts-btn">List Available Fonts</button>
    </div>
  </form>

  <div id="font-list-container" style="display: none;">
      <h4>Available Fonts:</h4>
      <pre id="font-list"></pre>
  </div>

  <div class="notes-section">
    <h3>Notes:</h3>
    <ul>
      <li>Leave Font Size field blank for auto-sized labels.</li>
      <li>Font Sizes: Small 12-18 / Medium 20-28 / Large 30-40</li>
    </ul>
  </div>

  <script src="/static/js/main.js"></script>
</body>

</html>
